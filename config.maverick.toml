baseURL = "https://carlosrabelo.com/"
title = "Carlos Rabelo"
theme = "maverick"
defaultContentLanguage = "en"
locale = "en-US"
enableGitInfo = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[menu]

  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 1

  [[menu.main]]
    identifier = "articles"
    name = "Articles"
    url = "/articles/"
    weight = 2

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 3

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]

[outputFormats.RSS]
  mediatype = "application/rss"
  baseName = "atom"

[outputFormats.JSON]
  mediatype = "application/json"
  baseName = "feed"

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  author = "Carlos Rabelo"
  jobTitle = "Software Engineer & Systems Architect"
  description = "Software engineering, systems architecture, network tooling, and open-source infrastructure by Carlos Rabelo."
  copyright = "Carlos Rabelo"
  logo = "/assets/og-default.png"
  images = ["/assets/og-default.png"]
  knowsAbout = [
    "Systems Architecture",
    "Go (Programming Language)",
    "Networking",
    "Emulation",
    "Open Source",
  ]
  # Uncomment githubRepo after installing the Utterances app on the repository.
  [params.comments]
    # githubRepo = "carlosrabelo/carlosrabelo.com"
    theme = "preferred-color-scheme"
  [params.social]
    github = "https://github.com/carlosrabelo"
    instagram = "https://www.instagram.com/carlosrabelo"
    twitter = "https://x.com/carlosrabelo"
  [params.sister_site]
    url = "https://carlosrabelo.com.br/"
    lang = "pt-BR"
    label = "Português"
    flag = "🇧🇷"

[services.googleAnalytics]
  id = "G-QV74CV38L4"

[privacy.googleAnalytics]
  disable = false
  respectDoNotTrack = true
