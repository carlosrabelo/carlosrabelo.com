<li>
  <div class="post-list-item">
    <div class="post-header">
      <h4 class="post-link">
        <a href="{{ .Permalink }}">{{ .Title }}</a>
        {{ if .Draft }}<span class="draft-label">RASCUNHO</span>{{ end }}
      </h4>
      {{ if in (partial "article-sections.html" .) .Section }}
      <h4 class="post-date">{{ partial "date-full.html" .Date }}</h4>
      {{ end }}
    </div>
    <div class="post-summary">
      <p>{{ with .Description }}{{ . }}{{ else }}{{ .Summary | truncate 160 }}{{ end }}</p>
    </div>
    <div class="post-list-footer text-center">
      <a href="{{ .Permalink }}">{{ i18n "read-more" }}</a>
    </div>
  </div>
</li>
