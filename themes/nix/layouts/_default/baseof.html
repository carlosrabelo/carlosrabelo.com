<!doctype html>
<html lang="{{ .Site.Language.Lang }}">

<body>

  {{- partial "header.html" . -}}

    <main id="main" class="container wrapper">
      {{- block "main" . }}{{ end -}}
    </main>
    {{- partial "footer.html" . -}}
  </div>
</body>
</html>
