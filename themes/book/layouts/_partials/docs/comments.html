{{/* Utterances comments — matches maverick/nix site config. */}}
{{ if .Site.Params.comments.githubRepo }}
<script src="https://utteranc.es/client.js"
    repo="{{ .Site.Params.comments.githubRepo }}"
    issue-term="pathname"
    theme="{{ .Site.Params.comments.theme | default "preferred-color-scheme" }}"
    crossorigin="anonymous"
    async>
</script>
<noscript>Comentários requerem JavaScript.</noscript>
{{ end }}
